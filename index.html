<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard de monitoreo del proyecto</title>
<style>
:root{
  --page:#f4f5f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d68; --grid:#e1e0d9; --axis:#c3c2b7;
  --navy:#0d366b; --navy2:#184f95; --blue:#2a78d6; --plan:#86b6ef; --real:#1c5cab; --orange:#eb6834; --aqua:#1baf7a;
  --ok:#0ca30c; --warn:#fab219; --serious:#ec835a; --bad:#d03b3b; --none:#898781; --okText:#006300;
  --ring:rgba(11,11,11,.10);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--navy);color:#fff;padding:18px 24px 0}
.top .row{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.top .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.top h1{font-size:22px;margin-top:2px}
.top .sub{opacity:.85;font-size:13px;margin-top:2px}
.clock{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 14px;text-align:right}
.clock b{font-size:20px}
.clock span{display:block;font-size:12px;opacity:.85}
nav.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
nav.tabs a{color:#cfe0f7;text-decoration:none;padding:10px 16px;border-radius:8px 8px 0 0;font-weight:550;white-space:nowrap;font-size:14px}
nav.tabs a:hover{background:rgba(255,255,255,.08)}
nav.tabs a.on{background:var(--page);color:var(--navy)}
main{max-width:1280px;margin:0 auto;padding:20px 24px 48px}
.banner{background:#fff6dc;border:1px solid #f0d78a;border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:2px}
.card .hint{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:99px;background:#f0efec;white-space:nowrap}
.chip i{font-style:normal;font-size:11px}
.ok i{color:var(--ok)}.warn i{color:#d9960a}.bad i{color:var(--bad)}.none i{color:var(--none)}.info i{color:var(--blue)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--grid);font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);background:#f7f7f4;position:sticky;top:0;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.bar{height:10px;background:#ececE6;border-radius:5px;position:relative;overflow:hidden}
.bar>b{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar.t{height:14px}
.pair{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.pair:last-child{border:0}
.pair .bars{display:grid;gap:3px}
.pair .nums{font-size:12px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:4px 0 10px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.legend span.ln::before{height:3px;vertical-align:3px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid)}
.alert:last-child{border:0}
.alert b{display:block;font-size:13px}
.alert p{margin:1px 0 0;color:var(--ink2);font-size:12.5px}
.alert a{color:var(--navy2);font-size:12.5px}
.sev{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;font-size:12px;font-weight:700;color:#fff}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn);color:#0b0b0b}.sev.info{background:var(--blue)}
.lvl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--navy2);border-radius:5px;padding:2px 7px;white-space:nowrap}
.field{display:grid;gap:3px;font-size:12px;color:var(--ink2)}
.field input,.field select,.field textarea{border:1px solid var(--axis);border-radius:7px;padding:6px 8px;background:#fff;min-width:0;color:var(--ink);font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.btn{border:1px solid var(--navy2);background:var(--navy2);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy2)}
.btn.ghost:hover{background:#eef4fc}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
td input.cell{width:64px;border:1px solid var(--axis);border-radius:6px;padding:3px 6px;text-align:right;background:#fff}
.ind{border:1px solid var(--grid);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:#fff}
.ind .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ind .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:10px 0;font-size:12.5px}
.ind .meta dt{color:var(--ink2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.ind .meta dd{margin:0}
.ind .two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.ind .two{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.pair .nums{text-align:left}main{padding:14px}}
.gantt{min-width:1220px}
.grow{display:grid;grid-template-columns:270px 150px 84px 150px 104px 1fr;align-items:stretch;border-bottom:1px solid var(--grid);min-height:34px}
.grow.h{background:#f7f7f4;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);position:sticky;top:0;z-index:3}
.grow.grp{background:#eef2f8;font-weight:650}
.grow>div{padding:6px 8px;display:flex;align-items:center;font-size:12.5px}
.grow>div.months{display:grid;grid-template-columns:repeat(var(--m),1fr);position:relative;padding:0!important}
.months .c{border-left:1px solid var(--grid);height:100%;min-height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2)}
.months .c.cut{background:#dce9fa}
.grow.h .months .c{min-height:0;padding:6px 0}
.gb{position:absolute;top:7px;height:20px;border-radius:5px;background:#cde2fb;border:1px solid #86b6ef;overflow:hidden;z-index:2;cursor:default}
.gb>b{position:absolute;left:0;top:0;bottom:0;background:var(--real)}
.gb.crit{border:2px solid var(--ink)}
.cutline{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:4;pointer-events:none}
.code{font-weight:700;color:var(--navy2);margin-right:6px;font-variant-numeric:tabular-nums}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tip{position:fixed;z-index:50;pointer-events:none;background:#111;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;max-width:300px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{display:block;margin-bottom:2px}
#tip .r{display:flex;gap:8px;justify-content:space-between}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:60;padding:16px}
#modal .box{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:18px;max-height:90vh;overflow:auto}
#modal textarea{width:100%;height:280px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--axis);border-radius:8px;padding:8px}
svg text{font-family:inherit}
.mini{font-size:12px;color:var(--ink2)}
.sep{height:1px;background:var(--grid);margin:12px 0}
.tag{font-size:11px;background:#fff1cf;border:1px solid #f0d78a;border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:600}
a{color:var(--navy2)}
@media print{header nav,.banner,.btn{display:none!important}}
html{scroll-behavior:smooth}
.rise{animation:rise .6s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
.growx{transform-origin:left center;animation:growx .8s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
.wipe{animation:wipe 1s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
.pop{animation:pop .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes growx{from{transform:scaleX(0);opacity:.4}to{transform:none;opacity:1}}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0 round 6px)}to{clip-path:inset(0 0 0 0 round 6px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dotin{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.dotin{transform-box:fill-box;transform-origin:center;animation:dotin .45s cubic-bezier(.34,1.56,.64,1) both}
.card,.kpi,.ind{transition:box-shadow .25s}
.kpi:hover,.card:hover{box-shadow:0 6px 22px rgba(13,54,107,.09)}
table tr:hover td{background:#f4f8fd}
td,th{transition:background .15s}
.pair{transition:background .15s;border-radius:8px;padding-left:6px;padding-right:6px}
.pair:hover{background:#f4f8fd}
.grow{transition:background .15s}.grow:not(.h):not(.grp):hover{background:#f4f8fd}
.btn{transition:background .2s,transform .12s,box-shadow .2s}.btn:active{transform:scale(.97)}
.chip{transition:background .2s}
.bar>b,.gb>b{will-change:width}
.hg .band{fill:#1c5cab;opacity:0;transition:opacity .15s}
.hg:hover .band{opacity:.07}
svg .mk{transition:opacity .2s}
svg:has(.hg:hover) .hg:not(:hover) .mk{opacity:.4}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--navy2)}
@media (prefers-reduced-motion:reduce){.rise,.growx,.wipe,.pop,.dotin,.mk{animation:none!important}html{scroll-behavior:auto}}

</style>
</head>

<div id="tip"></div>

function corteMes(){
  if(S.corte!=null&&S.corte!=='')return clamp(+S.corte,0,HOR);
  const st=new Date(S.inicio+'T00:00:00'),now=new Date();
  if(isNaN(st))return 0;

}
function mesLabel(m){
  const st=new Date(S.inicio+'T00:00:00');if(isNaN(st))return 'Mes '+m;

}
(function cpm(){
  const succ={};ACTS.forEach(a=>{if(a.dep)(succ[a.dep]=succ[a.dep]||[]).push(a.cod)});
  const LS={};
  for(let i=ACTS.length-1;i>=0;i--){const a=ACTS[i],ss=succ[a.cod]||[];const lf=ss.length?Math.min(...ss.map(c=>LS[c]))-1:END;LS[a.cod]=lf-a.dur+1;a.slack=LS[a.cod]-a.ini;a.crit=a.slack<=0}
  const by=Object.fromEntries(ACTS.map(a=>[a.cod,a]));
  ACTS.forEach(a=>{a.viol=!!(a.dep&&by[a.dep]&&a.ini<by[a.dep].fin+1)});
})();
function simulate(cod,d){
  const ini=Object.fromEntries(ACTS.map(a=>[a.cod,a.ini]));ini[cod]+=d;
  const by=Object.fromEntries(ACTS.map(a=>[a.cod,a]));
  const moved=[];
  ACTS.forEach(a=>{if(a.dep){const need=ini[a.dep]+by[a.dep].dur;if(ini[a.cod]<need&&a.cod!==cod){ini[a.cod]=Math.max(ini[a.cod],need)}}if(ini[a.cod]!==a.ini)moved.push(a.cod)});
  const end=Math.max(...ACTS.map(a=>ini[a.cod]+a.dur-1));
  return {end,moved};
}
function expAct(a,m){return clamp((m-a.ini+1)/a.dur,0,1)}
function pctAct(a){return clamp((((S.acts[a.cod]||{}).pct)||0)/100,0,1)}
function statGap(g){return g<=0.10?'ok':g<=0.30?'warn':'bad'}
function actStatus(a,m){
  const p=pctAct(a),e=expAct(a,m);
  if(p>=1)return {k:'ok',l:'Completada'};
  if(m<a.ini)return {k:'none',l:'Por iniciar'};
  if(m>a.fin)return {k:'bad',l:'Atrasada'};
  const g=e-p;
  return {k:statGap(g),l:g<=0.10?'En curso':g<=0.30?'Con retraso leve':'Con retraso'};
}

  const W=list.reduce((s,a)=>s+a.dur,0)||1;
  return {real:list.reduce((s,a)=>s+a.dur*pctAct(a),0)/W,plan:list.reduce((s,a)=>s+a.dur*expAct(a,m),0)/W};
}
function planMonthly(){const r=Array(HOR+1).fill(0);ITEMS.forEach(it=>{const n=it.fin-it.ini+1;for(let k=it.ini;k<=it.fin;k++)r[k]+=it.total/n});return r}
function execMonthly(){const r=Array(HOR+1).fill(0);S.gastos.forEach(g=>{if(g.mes>=1&&g.mes<=HOR)r[g.mes]+=+g.monto||0});return r}
function execByItem(){const r={};S.gastos.forEach(g=>{r[g.item]=(r[g.item]||0)+(+g.monto||0)});return r}
const sum=a=>a.reduce((x,y)=>x+y,0);
const DIRECTO=sum(ITEMS.map(i=>i.total));
function indInfo(L){
  const st=S.ind[L.nivel]||{};
  const fileBase=L.base&&!/establecer/i.test(L.base)?num(L.base):null;
  const base=(st.base!==undefined&&st.base!==null&&st.base!=='')?+st.base:fileBase;
  const metaRaw=(st.meta!==undefined&&st.meta!==null&&st.meta!=='')?+st.meta:num(L.meta);
  const rel=/se reduce/i.test(L.indicador)&&/%/.test(L.meta);
  const meta=rel?(base!=null?base*(1-metaRaw/100):null):metaRaw;
  const plazo=num(L.plazo)||HOR;
  const meds=(st.meds||[]).slice().sort((a,b)=>a.mes-b.mes);
  const last=meds[meds.length-1]||null;
  const m=corteMes();
  const exp=m?clamp(m/plazo,0,1):0;
  let prog=null,k='none',lab='Sin medición';
  if(last){
    if(base==null){k='none';lab='Falta línea de base'}
    else if(meta===base){k='none';lab='Meta igual a la línea de base'}
    else{prog=clamp((last.valor-base)/(meta-base),0,1.5);const g=exp-Math.min(prog,1);k=m?statGap(g):'ok';lab=k==='ok'?'En ritmo':k==='warn'?'Rezago leve':'Rezago crítico'}
  }else if(m>=plazo){k='bad';lab='Plazo vencido sin medición'}
  return {base,meta,metaRaw,rel,plazo,meds,last,exp,prog,k,lab,fileBase,tent:/tentativa/i.test(L.meta),needBase:fileBase==null};
}
function budgetInfo(){
  const m=corteMes(),pm=planMonthly(),em=execMonthly();
  const planTo=sum(pm.slice(1,m+1)),execTo=sum(em.slice(1,m+1)),execAll=sum(em.slice(1));
  const ratio=planTo>0?execTo/planTo:null;
  let k='none',lab='Sin gasto previsto aún';
  if(ratio!=null){const d=Math.abs(1-ratio);k=d<=0.10?'ok':d<=0.25?'warn':'bad';lab=ratio<1?'Subejecución':ratio>1?'Sobreejecución':'Al día';if(k==='ok')lab='En línea con lo previsto'}
  return {m,pm,em,planTo,execTo,execAll,ratio,k,lab};
}
function alerts(){
  const A=[],m=corteMes();
  const fin=LV.find(l=>l.nivel==='Fin');
  if(fin&&num(fin.plazo)>END)A.push({s:'warn',t:'El plazo del indicador del Fin supera el cronograma',d:`El indicador del Fin vence en el mes ${num(fin.plazo)} (cierre del año lectivo 2028), pero las actividades terminan en el mes ${END}. Define cómo y quién medirá después de cerrar la ejecución, o ajusta el plazo.`,tab:'indicadores'});
  const nb=LV.filter(l=>indInfo(l).base==null);
  if(nb.length)A.push({s:'warn',t:`${nb.length} ${nb.length===1?'indicador sin línea de base':'indicadores sin línea de base'}`,d:`${nb.map(l=>l.nivel).join(' y ')}: la línea de base está "por establecer". Sin ella no se mide el cambio. Regístrala en Marco lógico e indicadores.`,tab:'indicadores'});
  const tent=LV.filter(l=>/tentativa/i.test(l.meta));
  if(tent.length)A.push({s:'info',t:`${tent.length} metas tentativas`,d:`Las metas de ${tent.map(l=>l.nivel).join(', ')} se ajustan cuando se cierre la línea de base y la matrícula SIMAT.`,tab:'indicadores'});
  ACTS.filter(a=>a.viol).forEach(a=>A.push({s:'warn',t:`Dependencia inconsistente en la actividad ${a.cod}`,d:(()=>{const pr=ACTS.find(x=>x.cod===a.dep),need=pr.fin+1,r=simulate(a.cod,need-a.ini);return `La ${a.cod} inicia en el mes ${a.ini} pero depende de la ${a.dep}, que termina en el mes ${pr.fin}. Con dependencia fin-a-inicio debería comenzar en el mes ${need}${r.end>END?', lo que mueve el cierre al mes '+r.end:' (el cierre se mantiene en el mes '+END+')'}. Ajusta la fecha o la dependencia.`})(),tab:'cronograma'}));
  const sinCosto=ACTS.filter(a=>!ITEMS.some(i=>i.cod===a.cod));
  if(sinCosto.length)A.push({s:'info',t:`${sinCosto.length} actividades sin costo`,d:`${sinCosto.map(a=>a.cod).join(', ')} no tienen ítems de presupuesto. Confirma si las asume el personal ya presupuestado.`,tab:'presupuesto'});
  if(!+S.indirecto)A.push({s:'warn',t:'Costos indirectos en 0 %',d:'El presupuesto solo incluye costos directos. Verifica el tope de la convocatoria y registra el porcentaje en Datos y ajustes.',tab:'datos'});
  const pend=ITEMS.filter(i=>/sujeto a confirmaci/i.test(i.base));
  if(pend.length)A.push({s:'info',t:'Contrapartida sujeta a confirmación',d:`${usd(sum(pend.map(i=>i.total)))} de la contrapartida (cupos SENA) depende de confirmar el aporte con la entidad.`,tab:'presupuesto'});
  A.push({s:'info',t:'Hoja de supuestos y riesgos sin diligenciar',d:'La matriz original no tiene supuestos registrados; el marco lógico queda sin la cuarta columna.',tab:'indicadores'});
  if(m>0){
    const at=ACTS.filter(a=>actStatus(a,m).k==='bad'&&actStatus(a,m).l!=='Por iniciar');
    if(at.length)A.push({s:'bad',t:`${at.length} ${at.length===1?'actividad atrasada o con retraso':'actividades atrasadas o con retraso'}`,d:at.map(a=>a.cod).join(', ')+' van por debajo de lo programado al mes '+m+'.',tab:'cronograma'});
    const bi=budgetInfo();
    if(bi.k==='bad'||bi.k==='warn')A.push({s:bi.k==='bad'?'bad':'warn',t:'Desviación en la ejecución del presupuesto',d:`Al mes ${m} se previó ${usd(bi.planTo)} y se ha ejecutado ${usd(bi.execTo)} (${pc(bi.ratio)} de lo previsto).`,tab:'presupuesto'});
    LV.forEach(l=>{const I=indInfo(l);if(I.k==='bad')A.push({s:'bad',t:`Indicador en rojo: ${l.nivel}`,d:I.lab+'.',tab:'indicadores'})});
    const ex=execByItem();ITEMS.forEach(it=>{if((ex[it.i]||0)>it.total*1.0001)A.push({s:'bad',t:'Gasto por encima de lo presupuestado',d:`${it.cod} · ${it.desc}: ${usd(ex[it.i])} ejecutado vs ${usd(it.total)} presupuestado.`,tab:'presupuesto'})});
  }
  const o={bad:0,warn:1,info:2};return A.sort((a,b)=>o[a.s]-o[b.s]);
}

function countUp(el){
  const txt=el.textContent,m=txt.match(/(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?/);if(!m)return;
  const grouped=m[1].includes('.'),dec=m[2]||'',decs=dec.length,target=parseFloat(m[1].replace(/\./g,'')+(dec?'.'+dec:''));
  const pre=txt.slice(0,m.index),post=txt.slice(m.index+m[0].length);
  const fmt=v=>{let t=decs?v.toFixed(decs):String(Math.round(v));let [ip,dp]=t.split('.');if(grouped)ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return pre+ip+(dp?','+dp:'')+post};
  const t0=performance.now(),dur=1000;
  const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=k<1?fmt(target*e):txt;if(k<1)requestAnimationFrame(step)};
  el.textContent=fmt(0);requestAnimationFrame(step);
}

        ${pairBars(RUBROS.map(r=>{const l=ITEMS.filter(i=>i.rubro===r);return {label:r,plan:sum(l.map(i=>i.total)),real:sum(l.map(i=>ex[i.i]||0))}}).sort((a,b)=>b.plan-a.plan),(v)=>usd(v))}</div>
      <div class="card"><h3>Registrar gasto ejecutado</h3><div class="hint">El gasto del mes se asigna a un ítem y alimenta la curva y los semáforos.</div>
        <div class="form"><label class="field" style="flex:1;min-width:220px">Ítem<select id="gI">${ITEMS.map(i=>`<option value="${i.i}">${i.cod} · ${esc(i.desc.slice(0,55))} (${usd(i.total)})</option>`).join('')}</select></label>
          <label class="field">Mes<input type="number" id="gM" min="1" max="${HOR}" value="${Math.max(1,b.m)}" style="width:70px"></label>
          <label class="field">Monto USD<input type="number" id="gV" min="0" step="any" style="width:100px"></label>
          <button class="btn sm" id="gAdd">Registrar</button></div>
        ${gs.length?`<div class="scroll" style="max-height:230px;margin-top:10px"><table><tr><th>Mes</th><th>Ítem</th><th class="n">USD</th><th></th></tr>${gs.map(g=>`<tr><td>${g.mes}</td><td>${esc(ITEMS[g.item].cod+' · '+ITEMS[g.item].desc.slice(0,40))}</td><td class="n">${nf.format(g.monto)}</td><td><button class="btn ghost sm" data-delg="${g.id}" aria-label="Eliminar gasto">Quitar</button></td></tr>`).join('')}</table></div><div class="mini">${S.gastos.length} registros en total, se muestran los más recientes.</div>`:'<p class="mini" style="margin-top:10px">Aún no hay gastos registrados.</p>'}</div>
    </div>
    <div class="card"><h3>Escenario de recorte</h3><div class="hint">Si el donante recorta el presupuesto, se protege lo Esencial: se recorta primero lo Deseable y luego lo Importante.</div>
      <div class="form"><label class="field" style="min-width:260px">Recorte: <b id="rcV">${S.recorte}%</b><input type="range" id="rc" min="0" max="50" step="1" value="${S.recorte}"></label></div><div id="rcR" style="margin-top:12px"></div></div>
    <div class="card"><h3>Detalle por ítems</h3><div class="hint">${rows.length} de ${ITEMS.length} ítems.</div>
      <div class="form" style="margin-bottom:10px">${sel('comp','Componente',COMPS)}${sel('fuente','Fuente',['Donante','Contrapartida'])}${sel('rubro','Rubro',RUBROS)}${sel('prio','Prioridad',['Esencial','Importante','Deseable'])}<label class="field">Buscar<input type="search" data-flt="q" value="${esc(FLT.q)}" placeholder="Descripción o código"></label></div>
      <div class="scroll"><table id="itemsTbl">${thead}
      ${rows.map(i=>{const e=ex[i.i]||0,p=e/i.total;return `<tr><td><span class="code">${i.cod}</span></td><td>${esc(i.rubro)}</td><td>${esc(i.desc)}</td><td>${esc(i.fuente)}</td><td class="n">${i.ini}–${i.fin}</td><td>${esc(i.prio)}</td><td class="n">${nf.format(i.total)}</td><td class="n">${nf.format(e)}</td><td><div class="bar"><b style="width:${clamp(p,0,1)*100}%;background:${p>1?'var(--bad)':'var(--real)'}"></b></div><span class="mini">${pc(p)}</span></td></tr>`}).join('')}
      <tr><td colspan="6"><b>Total filtrado</b></td><td class="n"><b>${nf.format(sum(rows.map(i=>i.total)))}</b></td><td class="n"><b>${nf.format(sum(rows.map(i=>ex[i.i]||0)))}</b></td><td></td></tr></table></div></div>`;
  },
  after(){
    const b=budgetInfo();
    const draw=()=>colChart($('#cM'),{label:'Flujo mensual',labels:Array.from({length:HOR},(_,i)=>'M'+(i+1)),ymax:Math.ceil(Math.max(...b.pm,...b.em)/1000)*1000||1000,yfmt:(v,t)=>t?usd(v):nf.format(v),tipTitle:i=>`Mes ${i+1} · ${mesLabel(i+1)}`,series:[{name:'Previsto',c:'#86b6ef',v:b.pm.slice(1)},{name:'Ejecutado',c:'#1c5cab',v:b.em.slice(1)}]});
    draw();window.__redraw=draw;
    const rc=()=>{
      const p=+$('#rc').value;S.recorte=p;save();$('#rcV').textContent=p+'%';
      const need=DIRECTO*p/100,D=sum(ITEMS.filter(i=>i.prio==='Deseable').map(i=>i.total)),I2=sum(ITEMS.filter(i=>i.prio==='Importante').map(i=>i.total));
      const cD=Math.min(need,D),cI=Math.min(need-cD,I2),done=cD+cI,short=need-done;
      const f={Deseable:D?cD/D:0,Importante:I2?cI/I2:0,Esencial:0};
      const comp=COMPS.map(c=>{const l=ITEMS.filter(i=>i.comp===c),o=sum(l.map(i=>i.total)),n=sum(l.map(i=>i.total*(1-f[i.prio])));return {c,o,n}});
      $('#rcR').innerHTML=`<p style="margin:0 0 8px">Recorte a lograr: <b>${usd(need)}</b> sobre ${usd(DIRECTO)} de costos directos. ${short>0.5?chip('bad','No alcanza sin tocar lo Esencial'):cI>0.5?chip('warn','Alcanza tocando Importantes'):chip('ok','Alcanza solo con Deseables')}</p>
        <div class="scroll"><table><tr><th>Prioridad</th><th class="n">Original</th><th class="n">Recortado</th><th class="n">Queda</th></tr>
        <tr><td>Esencial</td><td class="n">${nf.format(sum(ITEMS.filter(i=>i.prio==='Esencial').map(i=>i.total)))}</td><td class="n">0</td><td class="n">${nf.format(sum(ITEMS.filter(i=>i.prio==='Esencial').map(i=>i.total)))}</td></tr>
        <tr><td>Importante</td><td class="n">${nf.format(I2)}</td><td class="n">${nf.format(cI)}</td><td class="n">${nf.format(I2-cI)}</td></tr>
        <tr><td>Deseable</td><td class="n">${nf.format(D)}</td><td class="n">${nf.format(cD)}</td><td class="n">${nf.format(D-cD)}</td></tr></table></div>
        <div class="scroll" style="margin-top:10px"><table><tr><th>Componente</th><th class="n">Original</th><th class="n">Tras el recorte</th><th class="n">Variación</th></tr>${comp.map(x=>`<tr><td>${x.c}</td><td class="n">${nf.format(x.o)}</td><td class="n">${nf.format(x.n)}</td><td class="n">${pc((x.n-x.o)/x.o,1)}</td></tr>`).join('')}</table></div>
        <p class="mini">Supuesto: el recorte se reparte proporcionalmente entre los ítems de cada prioridad. ${short>0.5?`Faltan ${usd(short)} por recortar: habría que tocar ítems esenciales.`:''}</p>`;
    };
    $('#rc').addEventListener('input',rc);rc();
  }
};

/* --- Datos --- */
const vDatos={
  html(){
    const m=corteMes();
    return `<div class="grid g2">
    <div class="card"><h3>Proyecto y calendario</h3><div class="hint">El mes actual se calcula con la fecha de inicio, salvo que fijes un mes de corte.</div>
      <div class="form" style="flex-direction:column;align-items:stretch">
        <label class="field">Nombre del proyecto<input type="text" data-cfg="proyecto" value="${esc(S.proyecto)}"></label>
        <label class="field">Organización o donante<input type="text" data-cfg="entidad" value="${esc(S.entidad)}" placeholder="Opcional"></label>
        <label class="field">Fecha de inicio de la ejecución (Mes 1)<input type="date" data-cfg="inicio" value="${esc(S.inicio)}"></label>
        <label class="field">Mes de corte<select data-cfg="corte"><option value="">Automático (según la fecha de hoy)${S.corte==null||S.corte===''?' · hoy: Mes '+m:''}</option>${Array.from({length:HOR+1},(_,i)=>`<option value="${i}" ${S.corte!=null&&S.corte!==''&&+S.corte===i?'selected':''}>${i===0?'Antes de iniciar':'Mes '+i+' · '+mesLabel(i)}</option>`).join('')}</select></label>
        <label class="field">Costos indirectos sobre directos del donante (%)<input type="number" min="0" max="30" step="0.5" data-cfg="indirecto" value="${S.indirecto}"></label>
      </div></div>
    <div class="card"><h3>Guardar, compartir y reiniciar</h3><div class="hint">Los datos de avance se guardan en este navegador. Exporta una copia para llevarla a otro equipo o enviarla.</div>
      <div class="form"><button class="btn" id="bExp">Exportar datos (JSON)</button><button class="btn ghost" id="bImp">Importar datos</button></div>
      <div class="sep"></div>
      <div class="form"><button class="btn ghost" id="bDemo">Cargar datos de ejemplo</button><button class="btn danger" id="bClr">Borrar avances y empezar</button></div>
      <p class="mini" style="margin-top:10px">La planificación (indicadores, actividades, presupuesto y cronograma) viene de tu libro de Excel y no se borra. Si cambias el plan, hay que actualizar el archivo base del dashboard.</p></div>
    </div>
    <div class="card"><h3>Qué mide cada semáforo</h3>
      <table><tr><th>Elemento</th><th>Regla</th></tr>
      <tr><td>Actividad</td><td>Compara su % de avance con lo que debería llevar al mes de corte (lineal entre su inicio y fin). Hasta 10 puntos de brecha: verde; hasta 30: atención; más: crítico. Pasado su mes final sin completar: atrasada.</td></tr>
      <tr><td>Indicador</td><td>Avance hacia la meta = (último valor − línea de base) ÷ (meta − línea de base), frente al ritmo esperado (mes de corte ÷ plazo). Mismas brechas que las actividades. Plazo vencido sin medición: crítico.</td></tr>
      <tr><td>Presupuesto</td><td>Gasto acumulado ejecutado ÷ previsto al mes de corte. Entre 90 % y 110 %: verde; entre 75 % y 125 %: atención; fuera de ese rango: crítico.</td></tr>
      <tr><td>Ruta crítica</td><td>Actividades con holgura cero según la red completa de dependencias (fin a inicio, un mes de separación).</td></tr></table></div>`;
  },
  after(){}
};

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const th=e.target.closest('th[data-sort]');
  if(th){const k=th.dataset.sort;if(SORT.k===k)SORT.d=-SORT.d;else{SORT.k=k;SORT.d=1}rerender({rows:true});return}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.act==='clear'||t.id==='bClr'){
    if(t.id==='bClr'&&!t.dataset.sure){t.dataset.sure=1;t.textContent='Confirmar: borrar avances';setTimeout(()=>{if(t.isConnected){t.textContent='Borrar avances y empezar';delete t.dataset.sure}},4000);return}
    const k={proyecto:S.proyecto,entidad:S.entidad,inicio:S.inicio,indirecto:S.indirecto};S=Object.assign(fresh(),k);save();rerender();return}
  if(t.id==='bDemo'){const k={proyecto:S.proyecto,entidad:S.entidad,inicio:S.inicio,indirecto:S.indirecto};S=Object.assign(fresh(),k);applyDemo(S);save();rerender();return}
  if(t.id==='bExp'){
    const txt=JSON.stringify(S,null,1);
    openModal(`<h3>Exportar datos</h3><p class="mini">Copia este texto y guárdalo en un archivo .json, o intenta descargarlo.</p><textarea id="ta" readonly>${esc(txt)}</textarea><div class="form" style="margin-top:10px"><button class="btn" id="mCopy">Copiar</button><button class="btn ghost" id="mDl">Descargar archivo</button><button class="btn ghost" id="mClose">Cerrar</button></div><p class="mini" id="mMsg"></p>`);return}
  if(t.id==='bImp'){
    openModal(`<h3>Importar datos</h3><p class="mini">Pega el JSON exportado o elige el archivo. Reemplaza los avances actuales.</p><textarea id="ta" placeholder="Pega aquí el JSON"></textarea><div class="form" style="margin-top:10px"><input type="file" id="mFile" accept=".json,application/json"><button class="btn" id="mApply">Importar</button><button class="btn ghost" id="mClose">Cancelar</button></div><p class="mini" id="mMsg"></p>`);return}
  if(t.id==='mClose'){closeModal();return}
  if(t.id==='mCopy'){const ta=$('#ta');ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}try{navigator.clipboard.writeText(ta.value).then(()=>{$('#mMsg').textContent='Copiado.'},()=>{})}catch(x){}$('#mMsg').textContent=ok?'Copiado.':'Selecciona el texto y copia con Ctrl+C.';return}
  if(t.id==='mDl'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ta').value],{type:'application/json'}));a.download='monitoreo-proyecto.json';document.body.appendChild(a);a.click();a.remove();$('#mMsg').textContent='Si no se descargó, usa Copiar.'}catch(x){$('#mMsg').textContent='Descarga no disponible aquí: usa Copiar.'}return}
  if(t.id==='mApply'){try{const o=JSON.parse($('#ta').value);if(!o||!o.v||typeof o.acts!=='object')throw 0;S=Object.assign(fresh(),o);save();closeModal();rerender()}catch(x){$('#mMsg').textContent='El texto no es un JSON válido de este dashboard.'}return}
  if(t.dataset.addmed!=null){const i=+t.dataset.addmed,L=LV[i],v=$('#v'+i).value;if(v==='')return;const st=S.ind[L.nivel]=S.ind[L.nivel]||{};(st.meds=st.meds||[]).push({mes:+$('#m'+i).value||0,valor:+v,nota:$('#n'+i).value});S.demo=S.demo;save();rerender();return}
  if(t.dataset.delmed){const [i,j]=t.dataset.delmed.split(':').map(Number),L=LV[i],I=indInfo(L);const target=I.meds[j];const st=S.ind[L.nivel];st.meds=st.meds.filter(x=>x!==st.meds.find(y=>y.mes===target.mes&&y.valor===target.valor&&y.nota===target.nota));save();rerender();return}
  if(t.id==='gAdd'){const v=+$('#gV').value;if(!(v>0))return;S.gastos.push({id:uid(),item:+$('#gI').value,mes:clamp(+$('#gM').value||1,1,HOR),monto:v,nota:''});save();rerender();return}
  if(t.dataset.delg){S.gastos=S.gastos.filter(g=>g.id!==t.dataset.delg);save();rerender();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pct){S.acts[t.dataset.pct]={pct:clamp(+t.value||0,0,100)};save();rerender();return}
  if(t.dataset.ibase!==undefined){const st=S.ind[t.dataset.ibase]=S.ind[t.dataset.ibase]||{};st.base=t.value===''?null:+t.value;save();rerender();return}
  if(t.dataset.imeta!==undefined){const st=S.ind[t.dataset.imeta]=S.ind[t.dataset.imeta]||{};st.meta=t.value===''?null:+t.value;save();rerender();return}
  if(t.dataset.flt){FLT[t.dataset.flt]=t.value;rerender({rows:true});return}
  if(t.dataset.cfg){const k=t.dataset.cfg;S[k]=(k==='corte')?(t.value===''?null:+t.value):(k==='indirecto'?(+t.value||0):t.value);save();rerender();return}
  if(t.id==='mFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{$('#ta').value=r.result};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.flt==='q'){FLT.q=t.value;const pos=t.selectionStart;rerender();const n=$('[data-flt="q"]');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
window.addEventListener('hashchange',view);
let rz;
if(window.ResizeObserver)new ResizeObserver(()=>{const w=$('#main').clientWidth;if(Math.abs(w-lastW)<3)return;lastW=w;clearTimeout(rz);rz=setTimeout(()=>{if(window.__redraw){window.__anim=false;window.__redraw()}},90)}).observe($('#main'));
else window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(window.__redraw)window.__redraw()},120)});
view();
</script>
</body>
</html>
